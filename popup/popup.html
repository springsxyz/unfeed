<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UnFeed</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand-row">
        <div class="brand">UnFeed</div>
        <div class="plan"><span class="plan-badge">Free</span></div>
      </div>
      <p class="tagline">Remove the feed. Keep the app.</p>
    </header>

    <section class="signal-block" aria-label="Sites">
      <div class="bulk" id="bulk">
        <div class="bulk-seg" role="group" aria-label="Bulk site actions">
          <button type="button" id="enable-all" class="bulk-btn">Enable all</button>
          <button type="button" id="disable-all" class="bulk-btn">Disable all</button>
        </div>
      </div>
      <main class="main" id="site-list">
        <!-- rows injected by popup.js -->
      </main>
    </section>

    <div class="end-space" aria-hidden="true"></div>

    <footer class="popup-links">
      <a href="https://unfeed.dev/" id="site-link" target="_blank" rel="noopener noreferrer">Website</a>
      <span class="dot" aria-hidden="true">·</span>
      <a href="#" id="privacy-link">Privacy</a>
    </footer>

    <script src="../shared/config.js"></script>
    <script src="site-icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
